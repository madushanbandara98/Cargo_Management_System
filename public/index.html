<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cargo Management</title></head>
  <body>
    <div id="react-root"></div>
    <main id="app"></main>
    <template id="login-template"><section class="login-page"><aside class="login-showcase"><div class="showcase-brand"><span class="showcase-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6.5 12 2l9 4.5v11L12 22l-9-4.5v-11Zm9 5.5 9-4.5M12 12 3 7.5M12 12v10M7.5 4.25l9 4.5"/></svg></span><span id="login-business-name" class="showcase-business"></span></div><div class="showcase-copy"><p class="showcase-kicker">Cargo operations, simplified</p><h1>Move every shipment forward with confidence.</h1><p>Manage customers, consignments, box details, and invoices from one secure workspace.</p></div><div class="showcase-status"><span class="status-pulse" aria-hidden="true"></span><span>Secure cloud workspace</span></div></aside><main class="login-panel"><div class="login-card"><div class="mobile-brand"><span class="showcase-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6.5 12 2l9 4.5v11L12 22l-9-4.5v-11Zm9 5.5 9-4.5M12 12 3 7.5M12 12v10M7.5 4.25l9 4.5"/></svg></span><span id="login-mobile-business-name"></span></div><div class="login-heading"><p class="login-eyebrow">Welcome back</p><h2>Sign in to your account</h2><p>Enter your credentials to continue to the dashboard.</p></div><form id="login-form"><label for="login-username">Username</label><div class="login-input-wrap"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg><input id="login-username" name="username" autocomplete="username" placeholder="Enter your username" required autofocus></div><label for="login-password">Password</label><div class="login-input-wrap"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5V10Z"/></svg><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div><button class="login-submit" type="submit">Sign in <span aria-hidden="true">→</span></button></form><p class="login-security"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 22s8-3.5 8-10V5l-8-3-8 3v7c0 6.5 8 10 8 10Z"/></svg>Your connection is secured and encrypted.</p></div></main></section></template>
    <template id="dashboard-template"><div class="layout"><aside class="sidebar"><div class="sidebar-top"><div class="profile"><div class="avatar" aria-hidden="true">A</div><div><p class="profile-label">Administrator</p><strong id="admin-name">Admin</strong></div></div><nav class="sidebar-nav" aria-label="Dashboard navigation"><button id="current-shipment" class="nav-button">Current shipment</button><button id="new-shipment" class="nav-button">New shipment</button><button id="settings" class="nav-button">Settings</button><button id="employees" class="nav-button hidden">Employees</button></nav></div><button id="logout" class="nav-button sign-out">Sign out</button></aside><section class="content"><div id="shipment-workspace"><div class="page-heading"><div><h2>Shipments</h2><p>Each consignment belongs to one shipment; customers can appear in more than one.</p></div></div><section id="shipment-form" class="card hidden"><h3>Create shipment</h3><form id="create-shipment"><label>Name<input name="name" required placeholder="July 2026 Germany–Sri Lanka"></label><label>Reference<input name="reference" required placeholder="JUL-2026-01"></label><button>Create</button><button type="button" id="cancel-shipment" class="secondary">Cancel</button></form></section><div id="shipment-list" class="cards"></div><section id="consignment-panel" class="card hidden"></section></div><section id="employees-panel" class="card hidden"><h2>Employees</h2><form id="employee-form"><label>Employee name<input name="fullName" required></label><label>Username<input name="username" required></label><label>Temporary password<input name="password" type="password" minlength="8" required></label><button>Add employee</button></form><div id="employee-list" class="cards"></div></section><section id="settings-panel" class="card hidden"><h2>Account &amp; business details</h2><p>Edit the details for the person and business using this account.</p><form id="profile-settings-form"><label>Username<input name="username" required></label><label>Your name<input name="fullName"></label><label>Business name<input name="businessName"></label><label>Phone<input name="phone" type="tel"></label><label>Email<input name="email" type="email"></label><label>Business address<input name="businessAddress"></label><button>Save account details</button></form></section></section></div></template>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
